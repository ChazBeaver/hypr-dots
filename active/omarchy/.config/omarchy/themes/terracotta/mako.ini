background-color=#171212
text-color=#DCC9BC
border-color=#453636
progress-color=over #3E3030
width=420
height=110
padding=12
border-size=2
border-radius=12
font=Liberation Sans 11
anchor=top-right
outer-margin=20
default-timeout=5000
max-icon-size=32
icons=1
markup=1
format=<b>%s</b>\n%b

[urgency=low]
background-color=#171212
text-color=#9C8181
border-color=#2D2424
default-timeout=3000

[urgency=normal]
background-color=#171212
text-color=#DCC9BC
border-color=#453636
default-timeout=5000

[urgency=high]
background-color=#171212
text-color=#DCC9BC
border-color=#CF223E
default-timeout=0

[app-name=Spotify]
invisible=1

[mode=do-not-disturb]
invisible=true

[mode=do-not-disturb app-name=notify-send]
invisible=false
