# =========================
# System
# =========================

# Hyprland System

## Lock System
unbind = SUPER CTRL, L
bindd = SUPER CTRL, L, Lock system, exec, OMARCHY_LOCK_ONLY=true omarchy-system-lock

## Reload Hyprland config
bindd = SUPER, R, Hyprland Reload, exec, hyprctl reload

# System Utilities
unbind = SUPER CTRL, H
bindd = SUPER CTRL, H, Hibernate/Suspend, exec, /usr/bin/systemctl suspend
bindd = SUPER CTRL, P, Power Off, exec, /usr/bin/systemctl poweroff
bindd = SUPER CTRL, R, Reboot, exec, /usr/bin/systemctl reboot

# Monitor brightness (DDC)
bindd = SUPER, up, Brightness Up, exec, /usr/bin/bash -lc '"$HOME/.local/bin/monitor-brightness" up 20'
bindd = SUPER, down, Brightness Down, exec, /usr/bin/bash -lc '"$HOME/.local/bin/monitor-brightness" down 20'

# Omarchy visual mode / opacity cycle (you already had this)
unbind = SUPER, BACKSPACE
bindd  = SUPER, BACKSPACE, Cycle visual modes, exec, ~/.config/hypr/scripts/hypr-opacity-cycle.conf

# Appearance
unbind = SUPER SHIFT CTRL, SPACE
bindd = SUPER ALT CTRL, SPACE, Theme menu, exec, omarchy-menu theme

# Screenshot
unbind = SUPER SHIFT, S
bindd = SUPER SHIFT, S, Screenshot, exec, omarchy-capture-screenshot

# Cycle monitor scaling with SUPER + /
unbind = SUPER, code:61
bindd = SUPER, code:61, Cycle monitor scaling, exec, omarchy-hyprland-monitor-scaling-cycle
unbind = SUPER ALT, code:61
bindd = SUPER ALT, code:61, Cycle monitor scaling backwards, exec, omarchy-hyprland-monitor-scaling-cycle --reverse

unbind = SUPER ALT CTRL, W
bindd = SUPER ALT CTRL, W, Weather, exec, notify-send -u low "$(/home/chaz/.local/share/omarchy/bin/omarchy-weather-status)"

# Toggle Window Gaps
# uses custom setup to reverse omarchy default
# files can be found here: ~/.config/hypr/overlay/gaps-toggle/
# sourced from this file: ~/.config/hypr/hyprland.conf
# custom script here: hyprdots/bin/linux/toggle-window-gaps.sh
unbind = SUPER SHIFT, BACKSPACE
bindd = SUPER SHIFT, BACKSPACE, Toggle window gaps, exec, toggle-window-gaps

# =========================
# Workspaces and Groups
# =========================

# Workspace navigation
unbind = SUPER, COMMA
bindd  = SUPER, COMMA, Workspace left, workspace, -1

unbind = SUPER, PERIOD
bindd  = SUPER, PERIOD, Workspace right, workspace, +1

# Move Active Window to Workspace
unbind = SUPER SHIFT, COMMA
bindd = SUPER SHIFT, COMMA,  Move active window LEFT a workspace, movetoworkspace, -1
unbind = SUPER SHIFT, PERIOD
bindd = SUPER SHIFT, PERIOD, Move active window RIGHT a workspace, movetoworkspace, +1

# Group navigation

## Cycle Groups Tabs
unbind = SUPER ALT, COMMA
bindd  = SUPER ALT, COMMA, Group left, changegroupactive, b
unbind = SUPER ALT, PERIOD
bindd  = SUPER ALT, PERIOD, Group right, changegroupactive, f

## Move Group Tabs 
unbind = SUPER ALT CTRL, COMMA
bindd = SUPER ALT CTRL, COMMA, Move group tab left, movegroupwindow, b
unbind = SUPER ALT CTRL, PERIOD
bindd = SUPER ALT CTRL, PERIOD, Move group tab right, movegroupwindow, f

## =========================
## Notifications
## =========================

# Dismiss all notifications
unbind = SUPER SHIFT ALT, M
bindd = SUPER SHIFT ALT, M, Dismiss all notifications, exec, makoctl dismiss --all

# Restore last dismissed
unbind = SUPER SHIFT ALT, COMMA
bindd = SUPER SHIFT ALT, COMMA, Restore last notification, exec, makoctl restore

# Do Not Disturb toggle
unbind = SUPER SHIFT ALT, PERIOD
bindd = SUPER SHIFT ALT, PERIOD, Toggle silencing notifications, exec, omarchy-toggle-notification-silencing

# Unbind duplicate Omarchy action
unbind = SUPER CTRL, COMMA

# Timer
unbind = SUPER CTRL ALT, T
bindd = SUPER CTRL ALT, T, Set a timer, exec, omarchy-timer


# =========================
# Applications
# =========================
unbind = SUPER ALT, SEMICOLON
bindd = SUPER ALT, SEMICOLON, Passwords, exec, uwsm-app -- keepassxc

bindd = SUPER ALT, L, LocalSend, exec, uwsm-app -- localsend
bindd = SUPER ALT, A, Claude.AI, exec, omarchy-launch-webapp "https://claude.ai/new"
bindd = SUPER SHIFT, E, Email, exec, omarchy-launch-webapp "https://www.gmail.com"
bindd = SUPER SHIFT, C, Calendar, exec, omarchy-launch-webapp "https://calendar.google.com/calendar/"

bindd = SUPER SHIFT, W, LibreOffice Writer, exec, uwsm-app -- libreoffice --writer
bindd = SUPER ALT,  W, Typora, exec, uwsm-app -- typora --enable-wayland-ime

# Discord (your system provides ~/.local/share/applications/Discord.desktop)
unbind = SUPER SHIFT, D
bindd = SUPER SHIFT, D, Discord, exec, uwsm-app -- gtk-launch Discord

