# =========================
# System
# =========================
# Hyprland System
# Reload Hyprland config
bindd = SUPER, R, Hyprland Reload, exec, hyprctl reload

# System Utilities
unbind = SUPER CTRL, H
bindd = SUPER CTRL, H, Hibernate/Suspend, exec, /usr/bin/systemctl suspend
bindd = SUPER CTRL, P, Power Off, exec, /usr/bin/systemctl poweroff
bindd = SUPER CTRL, R, Reboot, exec, /usr/bin/systemctl reboot

# Monitor brightness (DDC)
bindd = SUPER, up, Brightness Up, exec, /usr/bin/bash -lc '"$HOME/.local/bin/monitor-brightness" up 20'
bindd = SUPER, down, Brightness Down, exec, /usr/bin/bash -lc '"$HOME/.local/bin/monitor-brightness" down 20'

# Omarchy visual mode / opacity cycle (you already had this)
unbind = SUPER, BACKSPACE
bindd  = SUPER, BACKSPACE, Cycle visual modes, exec, ~/.config/hypr/scripts/hypr-opacity-cycle.conf

# Appearance
unbind = SUPER SHIFT CTRL, SPACE
bindd = SUPER ALT CTRL, SPACE, Theme menu, exec, omarchy-menu theme

unbind = SUPER SHIFT, S
bindd = SUPER SHIFT, S, Screenshot region to clipboard, exec, omarchy screenshot region copy
# Utilities
# unbind = SHIFT, PRINT
# unbind = ALT, PRINT
# bindd = ALT, PRINT, Screenshot to clipboard, exec, omarchy-cmd-screenshot smart clipboard
# bindd = SHIFT, PRINT, Screenrecording, exec, omarchy-menu screenrecord

# Cycle Monitor Scaling
unbind = SUPER, Slash
unbind = SUPER, backslash
bindd  = SUPER, backslash, Cycle monitor scaling, exec, omarchy-hyprland-monitor-scaling-cycle

# =========================
# Workspaces and Groups
# =========================
# Workspace navigation
unbind = SUPER, COMMA
bindd  = SUPER, COMMA, Workspace left, workspace, -1

unbind = SUPER, PERIOD
bindd  = SUPER, PERIOD, Workspace right, workspace, +1

# Move Active Window to Workspace
unbind = SUPER SHIFT, COMMA
bindd = SUPER SHIFT, COMMA,  Move active window LEFT a workspace, movetoworkspace, -1
unbind = SUPER SHIFT, PERIOD
bindd = SUPER SHIFT, PERIOD, Move active window RIGHT a workspace, movetoworkspace, +1

# Group navigation
unbind = SUPER ALT, COMMA
bindd  = SUPER ALT, COMMA, Group left, changegroupactive, b

unbind = SUPER ALT, PERIOD
bindd  = SUPER ALT, PERIOD, Group right, changegroupactive, f


## =========================
## Notifications
## =========================
unbind = SUPER CTRL ALT, M
bindd = SUPER CTRL ALT, M, Dismiss all notifications, exec, makoctl dismiss --all

unbind = SUPER SHIFT ALT, COMMA
unbind = SUPER CTRL ALT,
bindd = SUPER CTRL ALT, COMMA, Restore last notification, exec, makoctl restore

unbind = SUPER CTRL ALT, PERIOD
bindd = SUPER CTRL ALT, PERIOD, Toggle silencing notifications, exec, omarchy-toggle-notification-silencing

unbind = SUPER CTRL, COMMA

# Timer
unbind = SUPER CTRL ALT, T
bindd = SUPER CTRL ALT, T, Set a timer, exec, omarchy-timer
