general {
    lock_cmd = omarchy-lock-screen                         # lock screen and 1password
    before_sleep_cmd = loginctl lock-session               # lock before suspend/hibernate
    after_sleep_cmd = sleep 1 && hyprctl dispatch dpms on  # delay for PAM readiness, then turn on display after wake
    inhibit_sleep = 3                                      # wait until screen is locked before sleep/hibernate
}

listener {
    timeout = 900                      # 15min
    on-timeout = loginctl lock-session # trigger session lock, which uses general.lock_cmd
}

listener {
    timeout = 2700                    # 45min
    on-timeout = systemctl hibernate  # hibernate when timeout has passed
}
