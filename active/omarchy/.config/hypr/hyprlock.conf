# background using the current wallpaper
background {
    path = /home/chaz/Projects/home/hyprdots/active/omarchy/.config/omarchy/current/background
    blur_passes = 2
    blur_size = 4
}

# time widget
label {
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(255,255,255,1)

    font_size = 300
    font_family = FiraCode Nerd Font

    position = 0, 50
    halign = center
    valign = center
}

# date widget
label {
    text = cmd[update:1000] date +"%A, %B %d"
    color = rgba(200,200,200,1)

    font_size = 50
    font_family = FiraCode Nerd Font

    position = 0, -250
    halign = center
    valign = center
}

# password input
input-field {
    size = 300, 50
    outline_thickness = 3

    dots_size = 0.25
    dots_spacing = 0.4
    dots_center = true

    outer_color = rgba(200,200,200,1)
    inner_color = rgba(0,0,0,0.2)
    font_color = rgba(200,200,200,1)

    position = 0, -425
    halign = center
    valign = center
}
